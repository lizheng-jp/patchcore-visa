<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Anomaly Lab · Li Zheng</title>
<meta name="description" content="Live PatchCore anomaly detection on VisA with an EfficientSAM foreground-masking study. Built by Li Zheng.">
<meta name="author" content="Li Zheng">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="aurora-backdrop" aria-hidden="true"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div><div class="dot-grid"></div></div>

<header class="site-header glass">
  <div class="inner">
    <a class="brand" href="/">
      <span class="mark"><span></span></span>
      <span><b>Visual Anomaly Lab</b><span class="kicker">by Li Zheng</span></span>
    </a>
    <div class="header-tools">
      <a class="icon-link" href="https://github.com/lizheng-jp/patchcore-visa" target="_blank" rel="noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.7 5.38-5.27 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        <span>GitHub</span>
      </a>
      <select id="language" aria-label="Language / 言語"><option value="en">EN</option><option value="ja">日本語</option></select>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <p class="kicker" data-i18n="eyebrow"></p>
      <h1><span data-i18n="title1"></span> <span class="text-aurora" data-i18n="title2"></span></h1>
      <p data-i18n="intro"></p>
    </div>
    <div>
    <p class="kicker" id="stats-label" style="margin:0 0 10px"></p>
    <div class="hero-stats">
      <div class="card stat"><span class="kicker" data-i18n="stat_auroc"></span><span class="value" id="stat-auroc">—</span><small data-i18n="stat_auroc_note"></small></div>
      <div class="card stat"><span class="kicker" data-i18n="stat_fa"></span><span class="value" id="stat-fa">—</span><small data-i18n="stat_fa_note"></small></div>
      <div class="card stat"><span class="kicker" data-i18n="stat_miss"></span><span class="value" id="stat-miss">—</span><small data-i18n="stat_miss_note"></small></div>
    </div>
    </div>
  </section>

  <section class="workspace" aria-label="Live inference">
    <aside class="card">
      <p class="kicker step" data-i18n="step1"></p>
      <label class="field"><span data-i18n="model_select"></span>
        <select id="model"><option value="candle">Candle</option><option value="pcb4">PCB4</option><option value="macaroni2">Macaroni2</option></select>
      </label>
      <h3 data-i18n="samples"></h3>
      <div id="samples" class="samples"></div>
      <label id="drop" class="drop" tabindex="0"><span data-i18n="drop"></span><small data-i18n="choose"></small><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" hidden></label>
      <p class="note" id="model-hint"></p>
      <p class="kicker step" data-i18n="step2"></p>
      <button id="run" class="primary" data-i18n="run"></button>
      <label class="check"><input id="sam" type="checkbox"><span data-i18n="sam"></span></label>
      <p class="note" data-i18n="hint"></p>
      <div class="row"><span data-i18n="mask_scope"></span><select id="sam_scope"><option value="object" data-i18n="object"></option><option value="detail" data-i18n="detail"></option></select></div>
      <button id="clear" class="secondary" data-i18n="clear"></button>
      <div id="status" role="status"></div>
    </aside>

    <div class="card">
      <div class="result-head"><h3 data-i18n="workspace"></h3><span id="filename" data-i18n="no_image"></span></div>
      <div class="metrics">
        <div><span class="kicker" data-i18n="score"></span><strong id="score">—</strong><small class="sub" data-i18n="score_direction"></small></div>
        <div><span class="kicker" data-i18n="threshold_label"></span><strong id="threshold-value">—</strong><small class="sub" data-i18n="threshold_note"></small></div>
        <div><span class="kicker" data-i18n="decision"></span><strong id="decision">—</strong><small class="sub" id="truth"></small></div>
        <div><span class="kicker" data-i18n="elapsed"></span><strong id="elapsed">—</strong><small class="sub" data-i18n="cpu"></small></div>
      </div>
      <div class="grid">
        <figure><figcaption><span data-i18n="original"></span><span id="pointcount"></span></figcaption><div class="image-wrap"><canvas id="original" width="256" height="256"></canvas><p id="placeholder" data-i18n="placeholder"></p></div></figure>
        <figure><figcaption><span data-i18n="overlay"></span></figcaption><div class="image-wrap"><canvas id="overlay" width="256" height="256"></canvas></div></figure>
        <figure><figcaption><span data-i18n="region"></span><span data-i18n="explore"></span></figcaption><div class="image-wrap"><canvas id="region" width="256" height="256"></canvas></div></figure>
        <figure><figcaption><span data-i18n="sam_compare"></span><span id="samlabel"></span></figcaption><div class="image-wrap"><canvas id="masked" width="256" height="256"></canvas></div></figure>
      </div>
      <div class="colorbar"><span id="range-lo">—</span><i></i><span id="range-hi">—</span><span data-i18n="colorbar"></span></div>
      <div class="controls">
        <label for="threshold"><span data-i18n="pixel_threshold"></span><b id="pixelvalue" class="tabular">—</b></label>
        <input id="threshold" type="range" min="0" max="50" step=".1" value="25" disabled>
        <small data-i18n="slider_note"></small>
      </div>
      <div id="comparison" class="comparison" hidden></div>
    </div>
  </section>

  <section aria-labelledby="dist-heading">
    <div class="section-head">
      <div><p class="kicker" data-i18n="dist_kicker"></p><h2 id="dist-heading" data-i18n="dist_heading"></h2><p data-i18n="dist_intro"></p></div>
    </div>
    <div class="card chart-card">
      <div class="chart-meta">
        <span id="dist-summary"></span>
        <span class="legend"><span><i style="background:var(--normal)"></i><span data-i18n="normal"></span></span><span><i style="background:var(--anomaly)"></i><span data-i18n="anomalous"></span></span></span>
      </div>
      <svg id="dist" class="strip" role="img"></svg>
      <p class="chart-note" data-i18n="dist_note"></p>
    </div>
  </section>

  <section aria-labelledby="sam-heading">
    <div class="section-head">
      <div><p class="kicker" data-i18n="sam_kicker"></p><h2 id="sam-heading" data-i18n="sam_heading"></h2><p data-i18n="sam_intro"></p></div>
    </div>
    <div class="study">
      <div class="card chart-card">
        <svg id="sam-dist" class="strip" role="img"></svg>
        <p class="chart-note" data-i18n="sam_chart_note"></p>
      </div>
      <div class="card">
        <table>
          <thead><tr><th data-i18n="case_metric"></th><th data-i18n="case_before"></th><th data-i18n="case_after"></th></tr></thead>
          <tbody id="sam-table"></tbody>
        </table>
        <p class="chart-note" id="sam-protocol"></p>
      </div>
    </div>
    <div class="cases" id="cases"></div>

    <details class="archive">
      <summary data-i18n="case_archive"></summary>
      <p class="chart-note" data-i18n="case_intro"></p>
      <div class="archive-grid" id="archive"></div>
      <p class="chart-note" data-i18n="case_protocol"></p>
    </details>
  </section>
</main>

<footer>
  <div class="card">
    <div>
      <div class="byline"><span class="mark"><span></span></span><div><b>Li Zheng</b><div class="kicker" data-i18n="role"></div></div></div>
      <p data-i18n="about"></p>
      <div class="links">
        <a href="https://github.com/lizheng-jp/patchcore-visa" target="_blank" rel="noreferrer" data-i18n="link_repo"></a>
        <a href="https://lizheng.cc/" target="_blank" rel="noreferrer">lizheng.cc</a>
        <a href="https://github.com/lizheng-jp" target="_blank" rel="noreferrer">github.com/lizheng-jp</a>
      </div>
    </div>
    <div>
      <h4 data-i18n="evidence"></h4>
      <p id="model-evidence"></p>
      <p data-i18n="evidence2"></p>
      <p><span data-i18n="source"></span> <a href="https://github.com/amazon-science/spot-diff" target="_blank" rel="noreferrer">Amazon VisA</a><span data-i18n="license"></span></p>
    </div>
  </div>
</footer>
<script src="/i18n.js"></script>
<script src="/app.js"></script>

    beacon.dataset.cfBeacon = JSON.stringify({ token: '7368c2ca223a4e958680ce3c01e57dd4' });
    document.body.appendChild(beacon);
  }
</script>
</body>
</html>
