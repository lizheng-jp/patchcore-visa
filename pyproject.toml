[project]
name = "iad"
version = "0.1.0"
description = "SAM-masked PatchCore for industrial anomaly detection, evaluated with a leakage-free protocol on public datasets."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pillow>=10",
  "torch>=2.2",
  "torchvision>=0.17",
  "faiss-cpu>=1.8",
  "opencv-python-headless>=4.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
baseline = ["anomalib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
